{% for show in shows %}<a class="show-card" href="{% url 'public_show' show.id %}"><div class="poster">{% if show.public_poster %}<img loading="lazy" src="{{ show.public_poster }}" alt="Постер: {{ show.title }}" class="public-poster">{% else %}<span class="poster-placeholder" aria-label="Постер отсутствует">▤</span>{% endif %}</div><strong>{{ show.title }}</strong><small>{{ show.year|default:'Год не указан' }}{% if show.original_title %} · {{ show.original_title }}{% endif %}</small></a>{% empty %}<p>Ничего не найдено. Попробуйте другое название.</p>{% endfor %}
