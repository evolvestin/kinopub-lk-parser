services:
  init:
    image: busybox
    command: sh -c "mkdir -p /data && chown -R 1000:1000 /data"
    volumes:
      - ./data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: '256mb'
    env_file: .env
    command: postgres -c 'max_connections=100' -c 'shared_buffers=256MB'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - kinopub-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - kinopub-net

  app-init:
    build: .
    env_file: .env
    volumes:
      - .:/app:delegated
      - /app/frontend_webapp/dist # Сохраняем билд фронта внутри контейнера
      - ./data:/data
    # Do not let app-init wait forever on an old PostgreSQL transaction.
    # A timed-out migration fails visibly instead of hanging the deployment.
    command: >
      sh -c "
        timeout --signal=TERM --kill-after=30s 900s python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py createsuperuserifneeded
      "
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - kinopub-net

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8012}:8000"
    volumes:
      - .:/app:delegated
      - /app/frontend_webapp/dist # Сохраняем билд фронта внутри контейнера
      - ./data:/data
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - VITE_DEV_SERVER_HOST=frontend # Django должен искать Vite по имени контейнера
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        if [ \"$DJANGO_DEBUG\" = \"true\" ] || [ \"$DJANGO_DEBUG\" = \"True\" ]; then
          python manage.py runserver 0.0.0.0:8000;
        else
          gunicorn kinopub_parser.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2;
        fi
      "
    healthcheck:
      # Keep the liveness probe independent from admin rendering, sessions,
      # and database work.  /admin/login/ can exceed the health timeout while
      # the ASGI process itself is healthy, which blocks dependent services.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/robots.txt > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - kinopub-net

  asgi:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ASGI_PORT:-8013}:8001"
    volumes:
      - .:/app:delegated
      - /app/frontend_webapp/dist
      - ./data:/data
    environment:
      - VITE_DEV_SERVER_HOST=frontend
    command: daphne -b 0.0.0.0 -p 8001 kinopub_parser.asgi:application
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - kinopub-net

  celery:
    build: .
    command: celery -A kinopub_parser worker -l INFO --concurrency=4 --max-tasks-per-child=10 -Q celery
    restart: unless-stopped
    shm_size: '2gb'
    env_file: .env
    volumes:
      - .:/app:delegated
      - /app/frontend_webapp/dist
      - ./data:/data
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - kinopub-net
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery worker' > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-metrics:
    build: .
    command: celery -A kinopub_parser worker -l INFO --concurrency=1 --max-tasks-per-child=10 -Q metrics
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app:delegated
      - ./data:/data
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - kinopub-net
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery worker' > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build: .
    command: celery -A kinopub_parser beat -l INFO --schedule=/data/celerybeat-schedule
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app:delegated
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - kinopub-net
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery beat' > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 3

  email-listener:
    build: .
    command: python manage.py runemaillistener
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app:delegated
      - ./data:/data
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - kinopub-net
  
  telegram-bot:
    build:
      context: ./telegram_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - BACKEND_URL=http://web:8000
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
      - ./telegram_bot:/app
    networks:
      - kinopub-net

  telegram-bot-api:
    image: aiogram/telegram-bot-api@sha256:a6cbb08dd181df11bbe4dc71ab8d74a6c97e0c1fa148f5c7c617affca42de9ef
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${TELEGRAM_API_ID:-}" ] || [ -z "$${TELEGRAM_API_HASH:-}" ]; then
          echo "Local Telegram Bot API is disabled: TELEGRAM_API_ID/HASH are not configured";
          exec tail -f /dev/null;
        fi
        sed -i 's/^telegram-bot-api:x:101:101:/telegram-bot-api:x:1000:1000:/' /etc/passwd
        sed -i 's/^telegram-bot-api:x:101:/telegram-bot-api:x:1000:/' /etc/group
        exec /docker-entrypoint.sh
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - ./data:/data
    tmpfs:
      - /tmp/telegram-bot-api:uid=1000,gid=1000,mode=1777
    networks:
      - kinopub-net

  health-monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app:delegated
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: python manage.py runhealthdaemon
    healthcheck:
      test: [ "CMD-SHELL", "find /data -maxdepth 1 -name \"heartbeat_$${HOSTNAME}\" -mmin -3 -print -quit | grep -q ." ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - kinopub-net
    
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    working_dir: /app/frontend_webapp
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend_webapp:/app/frontend_webapp:delegated
      - /app/frontend_webapp/node_modules
      - ./kinopub_parser/static/css:/app/kinopub_parser/static/css:ro
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_DEV_SERVER_HOST=${VITE_DEV_SERVER_HOST:-localhost}
    networks:
      kinopub-net:
        aliases:
          - dynamic-vite-host.internal
    profiles:
      - dev

volumes:
  pgdata:
    name: ${PG_VOLUME_NAME:-kinopub_parser_pgdata}
  telegram_bot_api_data:
    name: ${TELEGRAM_BOT_API_VOLUME_NAME:-kinopub_parser_telegram_bot_api}

networks:
  kinopub-net:
    driver: bridge
